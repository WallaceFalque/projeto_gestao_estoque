services:
  mysql:
    image: mysql:8.4

    container_name: controle-estoque-mysql

    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: controle_estoque
      MYSQL_USER: estoque_user
      MYSQL_PASSWORD: estoque_pass

    ports:
      - "3307:3306"

    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data: